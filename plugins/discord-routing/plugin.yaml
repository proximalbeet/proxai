name: discord-routing
version: "1.3.0"
description: "Per-channel model routing for the ProxAI Discord bot. Picks a model tier from routing.json by channel name (threads follow their parent channel), handles !model and !opus, logs each routed message to #bot-audit-log, adds the vault privacy rule for cloud tiers, saves capture-channel notes itself, and guards tool calls (protected paths blocked, everything logged to the write-only 07-Security/ProxAI-Audit log), and sends each channel only the tools it may use (llm_request middleware)."
author: "prox"
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
  - post_tool_call
provides_tools:
  - report_security_event
