# Folder allow-list for the ProxAI gateway (Phase 6: "desktop access, no browsing").
# Install: ~/.config/systemd/user/hermes-gateway-proxai.service.d/sandbox.conf (see README.md).
#
# The gateway sees an empty home folder except the paths below. Everything else in ~
# (~/.ssh, ~/.git-credentials, ~/Documents outside the vault, ~/Downloads, ~/.config,
# browser profiles, the other Hermes profiles) is invisible to it and to anything it starts.
# %h = home folder, %t = /run/user/<uid>. A leading "-" means "skip if missing".

[Service]
# Empty, read-only /home, /root and /run/user; only the paths below are brought back.
ProtectHome=tmpfs
ProtectSystem=strict
PrivateTmp=yes
NoNewPrivileges=yes

# Hermes itself: this profile, plus the shared files every profile uses
# (kanban.db, cron/, installs/ leases). Code and the Python runtime are read-only.
BindPaths=%h/.hermes
BindReadOnlyPaths=%h/.hermes/hermes-agent %h/.hermes/tools
InaccessiblePaths=-%h/.hermes/profiles/onetouchai -%h/.hermes/profiles/huskytutor

# ProxAI state and logs (captures, focus session, mode.json, calendar/claude-code logs),
# Hermes gateway locks, the container's outbox + empty-folder mounts.
BindPaths=%h/.local/state/proxai %h/.local/state/hermes %h/.local/share/proxai

# Model caches (local Whisper, Kanye TTS). Writable so first-time downloads still work.
BindPaths=-%h/.cache/huggingface -%h/.cache/torch -%h/.cache/nvidia

# On PATH in the unit; read-only.
BindReadOnlyPaths=-%h/.local/bin

# Hermes refuses to start unless it can see its own installed unit file here (exit 78:
# "Profile 'proxai' does not get a gateway of its own"). Read-only: it can't edit units or this file.
BindReadOnlyPaths=%h/.config/systemd/user

# Claude Code workspace: the gateway maps /workspace/proxai paths back to the host to send files.
BindReadOnlyPaths=%h/dev/proxai

# Vault: read-only, except the folders the plugins write on the host.
# 01-Personal, .git and .obsidian are hidden; 07-Security shows only ProxAI-Audit (write-only log).
BindReadOnlyPaths=%h/Documents/ProxVault
BindPaths=%h/Documents/ProxVault/05-Brain-Dump %h/Documents/ProxVault/_inbox
InaccessiblePaths=-%h/Documents/ProxVault/01-Personal -%h/Documents/ProxVault/.git -%h/Documents/ProxVault/.obsidian
TemporaryFileSystem=%h/Documents/ProxVault/07-Security:ro
BindPaths=%h/Documents/ProxVault/07-Security/ProxAI-Audit

# User D-Bus + systemd: the mode switch (systemd-run --user) and vault-sync "sync now".
BindPaths=%t/bus %t/systemd
